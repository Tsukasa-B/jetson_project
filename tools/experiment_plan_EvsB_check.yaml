# =============================================================================
# experiment_plan_EvsB_check.yaml — 第3セッション（E vs B の決着だけ、30ラン）
#
#   python3 tools/run_experiment_batch.py --plan tools/experiment_plan_EvsB_check.yaml --dry_run
#   python3 tools/run_experiment_batch.py --plan tools/experiment_plan_EvsB_check.yaml --shuffle --seed 2
#
# ■ 目的
#   セッション1で観測された E > B (p=0.008) が、
#   ワイヤー修理後の正常なリグでも再現するかを最小コストで確かめる。
#   セッション1はワイヤー脱落によりBが 0.133（セッション2では0.324）と
#   劣化していたため、あの結果が「壊れたロボットでの優劣」だった可能性がある。
#
# ■ 曲を gmd_03_high_bpm138 だけに絞る理由
#   セッション1で E-B の差が最大だった条件（B 0.097 vs E 0.225, p<0.0001）。
#   差が出るなら真っ先にここに出る。30分で方向が決まる。
#
# ■ 判定の基準値（セッション2, ワイヤー正常時の gmd_03 での B）
#       B の ±30ms成功率 = 0.398 ± 0.132  (seed別: .573/.291/.248/.440/.436)
#
#   結果の読み方:
#     ・B が 0.40 前後で出る    → リグは正常。E との比較が意味を持つ
#     ・B が 0.20 を大きく割る  → リグがまだおかしい。中止してハード確認
#     ・E > B が再現           → セッション1の結論が正しい。残りの条件も撮る価値あり
#     ・E ≈ B / E < B          → 劣化リグ特有の現象だった。記憶軸の主張を見直す
#
# ★ --seed は 2（S1=0, S2=1）
# =============================================================================

name: "E vs B 決着チェック（gmd_03のみ, 30ラン）"
est_sec_per_run: 60
cooldown_sec: 3

blocks:
  - name: "E_vs_B_gmd03"
    models:
      - RAL/B_seed1
      - RAL/B_seed2
      - RAL/B_seed3
      - RAL/B_seed4
      - RAL/B_seed5
      - RAL/E_seed1
      - RAL/E_seed2
      - RAL/E_seed3
      - RAL/E_seed4
      - RAL/E_seed5
    songs:
      - songs/gmd_03_high_bpm138.mid
    trials: 3
    # → 10モデル × 1曲 × 3trial = 30ラン（約30分）

# ---------------------------------------------------------------------------
# 開始前チェック
#   □ ワイヤーの固定（修理済み） … 開始前と終了後に目視
#   □ 力センサのアンプ通電  → --verify で手で押し当てて F: が動くこと
#   □ コンプレッサ供給圧
#   □ 前セッションの結果を退避したか
#        mv results/RAL results/RAL_session2
# ---------------------------------------------------------------------------
